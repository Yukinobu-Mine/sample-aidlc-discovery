<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="title desc">
  <title id="title">AI-DLC Discovery のサイクル</title>
  <desc id="desc">AI-DLC Discovery で決定と Discovery brief を作り、commit なら AI-DLC などで開発に進みます。フォローアップでは、7 日後にベースラインをそろえ、30 日後までに実際の利用者でプロトタイプと未検証の仮説を確かめ、30 日後と 60 日後に成功基準と撤退基準を確かめます。学んだことは次のサイクルの Signals に戻します。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; fill: #1d2733; }
    .h { font-size: 16px; font-weight: 700; }
    .b { font-size: 13px; }
    .m { fill: #5b6470; }
    .w { fill: #ffffff; }
  </style>
  <rect width="900" height="450" fill="#ffffff"/>

  <!-- Top: Discovery -->
  <rect x="300" y="16" width="300" height="84" rx="12" fill="#1f4e79"/>
  <text x="450" y="46" text-anchor="middle" class="h w">AI-DLC Discovery</text>
  <text x="450" y="70" text-anchor="middle" class="b w">決定、プロトタイプ、Discovery brief、</text>
  <text x="450" y="88" text-anchor="middle" class="b w">次のステップとロードマップ</text>

  <!-- Right: Build -->
  <rect x="650" y="160" width="230" height="104" rx="12" fill="#e8f3ec" stroke="#2f7d4f" stroke-width="2"/>
  <text x="666" y="188" class="h">開発</text>
  <text x="666" y="212" class="b">Discovery brief をもとに</text>
  <text x="666" y="232" class="b">AI-DLC で開発する</text>
  <text x="666" y="252" class="b m">ほかの方法でも使える</text>

  <!-- Bottom: Follow-ups -->
  <rect x="210" y="306" width="480" height="128" rx="12" fill="#f4f5f7" stroke="#9aa3ad" stroke-width="1.5"/>
  <text x="226" y="334" class="h">フォローアップで確かめる</text>
  <text x="226" y="360" class="b"><tspan style="font-weight:700">7 日後まで</tspan>　ベースラインをそろえ、Discovery brief をリポジトリへ</text>
  <text x="226" y="384" class="b"><tspan style="font-weight:700">30 日後まで</tspan>　実際の利用者でプロトタイプと未検証の仮説を確かめる</text>
  <text x="226" y="408" class="b"><tspan style="font-weight:700">30・60 日後</tspan>　導入状況とビジネス指標を、成功基準と撤退基準で確かめる</text>

  <!-- Left: Next cycle -->
  <rect x="20" y="160" width="230" height="104" rx="12" fill="#e8f0f9" stroke="#2563a8" stroke-width="2"/>
  <text x="36" y="188" class="h">次のサイクルへ</text>
  <text x="36" y="212" class="b">学んだことを、次の</text>
  <text x="36" y="232" class="b">Signals に戻す</text>
  <text x="36" y="252" class="b m">先送りした候補を見直す</text>

  <!-- Arrows -->
  <path d="M604,58 C700,60 760,100 765,154" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="716" y="84" class="b m">commit の場合</text>
  <path d="M765,268 C762,320 740,350 696,362" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M204,370 C150,360 136,320 135,270" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M135,156 C140,100 200,60 294,58" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Center -->
  <text x="450" y="200" text-anchor="middle" class="b" style="font-weight:700">Discovery brief に残った未検証の仮説を、</text>
  <text x="450" y="222" text-anchor="middle" class="b" style="font-weight:700">一つずつ顧客で確かめる</text>
  <text x="450" y="262" text-anchor="middle" class="b m">pivot、park の場合は開発に進まず、</text>
  <text x="450" y="282" text-anchor="middle" class="b m">30 日後のフォローアップで見直す</text>
</svg>
